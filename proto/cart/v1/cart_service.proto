// cart_service.proto
// Сервис корзины покупателя.
// Версия: v1
// Автор: Артем Д.
// Дата: 22.10.2025

syntax = "proto3";

package cart.v1;

option go_package = "github.com/myshop/api/gen/go/cart/v1;cartv1";

// Элемент корзины: Товар и количество
message CartItem {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    int64 price = 4;
    string currency_code = 5;
}

// Запрос: добавить товар в корзину
message AddItemRequest {
    string user_id = 1;
    string product_id = 2;
    int32 quantity = 3;
}

// Ответ: Подтверждение добавления.
message AddItemResponse {
    //Пока что пусто
}

// Запрос: Получить корзину пользователя
message GetCartRequest {
    string user_id = 1;
}

//Ответ: Корзина пользователя
message GetCartResponse {
    repeated CartItem items = 1;
    int64 total_amount = 2;
    string currency_code = 3;
}

// Сервис управления корзиной покупателя
service CartService {
    rpc AddItem(AddItemRequest) returns (AddItemResponse);
    rpc GetCart(GetCartRequest) returns (GetCartResponse);
}