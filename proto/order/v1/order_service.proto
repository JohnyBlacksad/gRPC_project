// order_service.proto
// Сервис оформления заказов.
// Версия: v1
// Автор: Артем Д.
// Дата: 2025-10-22

syntax = "proto3";

package order.v1;

option go_package = "github.com/myshop/api/gen/go/order/v1;orderv1";

// Заказ
message Order {
    string id = 1;
    string user_id = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_CREATED = 1;     // Заказ создан
        STATUS_PAID = 2;        // Заказ оплачен
        STATUS_CANCELED = 3;    // Заказ отменен
    }

    Status status = 3;
    repeated order.v1.OrderItem items = 4;
    int64 total_amount = 5;
    string currency_code = 6;
    int64 created_at = 7;
}

// Элемент заказа
message OrderItem {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    int64 price = 4;
    string currency_code = 5;
}

// Запрос: оформить заказ
message CreateOrderRequest {
    string user_id = 1;
}

// Ответ: Созданный заказ
message CreateOrderResponse {
    Order order = 1;
}

// Сервис оформления заказов
service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}